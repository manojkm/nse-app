[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-mcp"
version = "1.0.0"
description = "MCP server and web dashboard for live NSE/BSE market data (powered by IndianAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nse-mcp = "nse_mcp.__main__:main"

[tool.setuptools]
packages = ["nse_mcp"]

[tool.setuptools.package-data]
nse_mcp = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
